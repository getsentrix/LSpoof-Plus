name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag'
        required: false
        default: 'v1.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LocationSpoofer.dylib
        run: |
          xcrun --sdk iphoneos clang -target arm64-apple-ios14.0 \
            -dynamiclib \
            -fobjc-arc \
            -Wall -Wextra \
            -Wl,-segalign,0x4000 \
            -ISource \
            Source/dylib_init.m \
            Source/LSHooking.m \
            Source/LocationSpoofer.m \
            Source/RouteSimulator.m \
            Source/BookmarksManager.m \
            Source/OverlayWindow.m \
            Source/MapPickerViewController.m \
            Source/MapPickerViewController+Route.m \
            Source/MapPickerViewController+Bookmarks.m \
            Source/PersistenceManager.m \
            Source/LSUpdateChecker.m \
            -framework Foundation \
            -framework UIKit \
            -framework CoreLocation \
            -framework MapKit \
            -framework CoreGraphics \
            -framework QuartzCore \
            -install_name @rpath/LocationSpoofer.dylib \
            -o LocationSpoofer.dylib
          codesign -s - -f LocationSpoofer.dylib
          codesign -dvv LocationSpoofer.dylib
          ls -lh LocationSpoofer.dylib

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpoofer.dylib
          path: LocationSpoofer.dylib

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "${{ github.ref }}" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v1.2.9"
            fi
          fi
          echo "Using tag: $TAG"
          cat << 'EOF' > notes.md
          ## LSpoof+ v1.2.9

          ### What's New
          - **UX Motion & Responsiveness**: Snappier tactile button press/release springs, top-anchored search suggestion transitions, and faster dismiss timings (`0.13s`–`0.14s`).
          - **Touch Targets**: Expanded close button hit target to `44x44`pt for easier one-handed dismissal.
          - **Accessibility**: Respects iOS Reduce Motion (`UIAccessibilityIsReduceMotionEnabled`) across shakes, bounces, and spring transforms.

          ### Assets
          - `LocationSpoofer.dylib`: Dynamic library for LiveContainer, TrollStore, and Sideloadly (iOS 14.0+).
          EOF

          gh release view "$TAG" --repo getsentrix/LSpoof-Plus >/dev/null 2>&1 && {
            gh release upload "$TAG" LocationSpoofer.dylib --repo getsentrix/LSpoof-Plus --clobber
          } || {
            gh release create "$TAG" LocationSpoofer.dylib \
              --repo getsentrix/LSpoof-Plus \
              --title "$TAG" \
              --notes-file notes.md || gh release upload "$TAG" LocationSpoofer.dylib --repo getsentrix/LSpoof-Plus --clobber
          }



